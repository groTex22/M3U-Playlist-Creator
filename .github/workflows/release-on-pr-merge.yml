name: PR Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  build-and-release:
    if: github.event.pull_request.merged == true
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build EXE
      run: |
        pip install pyinstaller
        pyinstaller --onefile --name ${{ github.event.repository.name }} main.py
    
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: pr-${{ github.event.pull_request.number }}-${{ github.sha }}
        name: "Build from PR #${{ github.event.pull_request.number }}"
        body: |
          **${{ github.event.pull_request.title }}**
          
          ```
          Автор: @${{ github.event.pull_request.user.login }}
          Дата: ${{ github.event.pull_request.merged_at }}
          Коммит: ${{ github.sha }}
          ```
        files: dist/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}