name: PR Release

on:
  pull_request:
    types: [closed]
    branches: [Main]

jobs:
  build-and-release:
    if: github.event.pull_request.merged == true
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path requirements.txt) {
          pip install -r requirements.txt
        }
    
    
    - name: Build EXE
      run: |
        pyinstaller --onefile --noconsole --name ${{ github.event.repository.name }} main.py
    
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: pr-${{ github.event.pull_request.number }}-${{ github.sha }}
        name: "Build from PR #${{ github.event.pull_request.number }}"
        body: |
          **${{ github.event.pull_request.title }}**
          
          ```
          Автор: @${{ github.event.pull_request.user.login }}
          Дата: ${{ github.event.pull_request.merged_at }}
          Коммит: ${{ github.sha }}
          ```
        files: dist/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}